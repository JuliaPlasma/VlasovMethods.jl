[weakdeps]
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
ElectromagneticFields = "d6c1ba6f-ee03-53af-b876-68cefeb88ec8"

[extensions]
VlasovMethodsElectromagneticFieldsExt = "ElectromagneticFields"
VlasovMethodsMakieExt = "CairoMakie"

[compat]
CairoMakie = "0.15"
# 0.9.1 is the first ElectromagneticFields on GeometricBase 0.15, which `GeometricIntegrators`
# 0.18.6 requires; 0.9.0 pins GeometricBase 0.14.
ElectromagneticFields = "0.9.1"
# 0.15.1 is the first GeometricBase whose `State` keeps the vector field of an empty state
# variable, which the vacuum run of `VlasovWithExternalFields` needs.
GeometricBase = "0.15.1"
GeometricBrackets = "0.2"
GeometricEquations = "0.21.5"
GeometricIntegrators = "0.18.6"
HDF5 = "0.17"
LinearAlgebra = "1"
Logging = "1"
MultiIndexArrays = "0.1.1"
Parameters = "0.12, 0.13"
ParticleMethods = "0.1.2"
# 0.6 is the first PoissonSolvers that admits SimpleSplines 0.3, which GeometricBrackets 0.2
# requires; 0.4 and 0.5 require SimpleSplines 0.1 or 0.2.
PoissonSolvers = "0.6"
# 1.3.3 is the floor TiffImages 0.10 needs, which the CairoMakie test dependency brings in; the
# Downgrade job cannot resolve `ProgressMeter = "1"` against it.
ProgressMeter = "1.3.3"
Random = "1"
# ReducedBasisMethods 0.2 provides the snapshot-based `ReducedBasis` and DEIM without a
# dependency on VlasovMethods.
ReducedBasisMethods = "0.2"
# ReducedComplexityModeling provides `ParameterSpace` and its HDF5 generics for the bases.
ReducedComplexityModeling = "0.1.1"
SimpleSolvers = "0.14.1"
SimpleSplines = "0.3.1"
Sobol = "1.5"
SpecialFunctions = "2"
StaticArrays = "1.9.13"
TerminalLoggers = "0.1"
julia = "1.11"
