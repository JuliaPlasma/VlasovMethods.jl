# The test groups of CI. GROUPS in runtests.jl lists the same groups, and empty ARGS runs them all.
# `split = true` runs one CI job per group and matrix entry, so each of the long groups
# `verification` and `galerkin` has a job, and its two workers, to itself.
# `once` names the groups that a pull request and a push run on Ubuntu × Julia 1 only; the weekly
# run, a tag and a run by hand run every group on every entry.
groups = ["core", "quality", "slow", "collisions", "verification", "galerkin"]
split = true
once = ["quality", "verification", "galerkin"]
